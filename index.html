<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Aether Spire</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: #0a0a1a;
    width: 100%; height: 100%;
    overflow: hidden;
    touch-action: manipulation;
  }
  #game-container {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; }
</style>
</head>
<body>
<div id="game-container"></div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
/* ============================================================
   AETHER SPIRE  —  Joheliv Labs
   Tap to drop each block. Perfect alignment preserves width
   and builds a score multiplier. How high can you rise?
   ============================================================ */

class SoundKit {
  constructor() { this.ctx = null; this.master = null; this.enabled = false; }

  arm() {
    const init = () => {
      if (this.ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      if (this.ctx.state === 'suspended') this.ctx.resume();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.32;
      this.master.connect(this.ctx.destination);
      this.enabled = true;
    };
    window.addEventListener('pointerdown', init, { once: true });
    window.addEventListener('touchstart', init, { once: true, passive: true });
    window.addEventListener('keydown', init, { once: true });
  }

  tone({ freq = 440, dur = 0.12, type = 'sine', vol = 0.5, slideTo = null }) {
    if (!this.enabled) return;
    const ctx = this.ctx;
    const t0 = ctx.currentTime;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(slideTo, 1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g);
    g.connect(this.master);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  place() {
    this.tone({ freq: 260, dur: 0.09, type: 'triangle', vol: 0.45, slideTo: 160 });
    this.tone({ freq: 130, dur: 0.12, type: 'sine', vol: 0.3 });
  }

  perfect(streak) {
    const base = 580 + Math.min(streak, 15) * 42;
    this.tone({ freq: base, dur: 0.10, type: 'sine', vol: 0.45 });
    this.tone({ freq: base * 1.5, dur: 0.14, type: 'sine', vol: 0.30 });
    this.tone({ freq: base * 2.5, dur: 0.18, type: 'sine', vol: 0.16 });
  }

  fail() {
    this.tone({ freq: 320, dur: 0.55, type: 'sawtooth', vol: 0.3, slideTo: 50 });
    if (!this.enabled) return;
    const ctx = this.ctx;
    const t0 = ctx.currentTime;
    const len = Math.floor(ctx.sampleRate * 0.35);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.16, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
    src.connect(g);
    g.connect(this.master);
    src.start(t0);
  }
}

class Game extends Phaser.Scene {
  constructor() { super('Game'); }

  create() {
    this.W = this.scale.width;
    this.H = this.scale.height;
    this.cx = this.W / 2;

    this.cameras.main.setBackgroundColor('#0a0a1a');

    /* constants */
    this.blockH   = 44;
    this.baseW    = 260;
    this.baseY    = 1100;
    this.baseSpeed = 3.4;

    /* state */
    this.speed      = this.baseSpeed;
    this.dir        = 1;
    this.score      = 0;
    this.multiplier = 1;
    this.streak     = 0;
    this.gameOver   = false;
    this.best       = parseInt(localStorage.getItem('aetherSpireBest') || '0', 10);

    /* audio */
    this.audio = new SoundKit();
    this.audio.arm();

    /* visuals */
    this.buildBackground();
    this.makeParticles();

    /* base block */
    const base = this.add.rectangle(this.cx, this.baseY, this.baseW, this.blockH, 0x38bdf8).setDepth(1);
    base.setStrokeStyle(3, 0x7dd3fc, 0.9);
    this.stack = [base];

    /* UI */
    this.scoreText = this.add.text(this.cx, 130, '0', {
      fontFamily: 'Arial Black, Arial, sans-serif',
      fontSize: '120px',
      color: '#ffffff'
    }).setOrigin(0.5).setScrollFactor(0).setDepth(100);

    this.multiplierText = this.add.text(this.cx + 170, 130, '', {
      fontFamily: 'Arial Black, Arial, sans-serif',
      fontSize: '44px',
      color: '#facc15'
    }).setOrigin(0.5).setScrollFactor(0).setDepth(100);

    this.bestText = this.add.text(this.cx, 225, 'BEST  ' + this.best, {
      fontFamily: 'Arial, sans-serif',
      fontSize: '24px',
      color: '#64748b'
    }).setOrigin(0.5).setScrollFactor(0).setDepth(100);

    this.hintText = this.add.text(this.cx, this.H - 130, 'TAP TO DROP', {
      fontFamily: 'Arial, sans-serif',
      fontSize: '26px',
      color: '#94a3b8',
      letterSpacing: 4
    }).setOrigin(0.5).setScrollFactor(0).setDepth(100);

    /* input */
    this.input.on('pointerdown', () => this.onTap());

    /* first block */
    this.spawnBlock();
  }

  /* ---------- visuals ---------- */
  buildBackground() {
    const g = this.add.graphics().setDepth(-10).setScrollFactor(0);
    const steps = 60;
    for (let i = 0; i < steps; i++) {
      const t = i / (steps - 1);
      const alpha = 0.10 * (1 - t);
      g.fillStyle(0x38bdf8, alpha);
      g.fillRect(0, (this.H / steps) * i, this.W, this.H / steps + 2);
    }
  }

  makeParticles() {
    if (!this.textures.exists('dot')) {
      const g = this.make.graphics({ x: 0, y: 0, add: false });
      g.fillStyle(0xffffff, 1);
      g.fillCircle(8, 8, 8);
      g.generateTexture('dot', 16, 16);
      g.destroy();
    }
    this.burst = this.add.particles(0, 0, 'dot', {
      speed: { min: 80, max: 260 },
      scale: { start: 0.7, end: 0 },
      alpha: { start: 1, end: 0 },
      lifespan: 550,
      blendMode: 'ADD',
      emitting: false
    }).setDepth(50);
  }

  colorForScore(s) {
    const hue = (0.55 + s * 0.022) % 1;
    return Phaser.Display.Color.HSLToColor(hue, 0.8, 0.6).color;
  }

  /* ---------- spawning ---------- */
  spawnBlock() {
    const last = this.stack[this.stack.length - 1];
    const y = last.y - this.blockH - 2;
    const startX = this.dir === 1 ? -last.width / 2 : this.W + last.width / 2;
    const color = this.colorForScore(this.score);

    this.current = this.add.rectangle(startX, y, last.width, this.blockH, color).setDepth(1);
    this.current.setStrokeStyle(3, 0xffffff, 0.35);
  }

  /* ---------- input ---------- */
  onTap() {
    if (this.gameOver) {
      this.scene.restart();
      return;
    }
    this.placeBlock();
  }

  placeBlock() {
    if (!this.current || this.gameOver) return;

    const last = this.stack[this.stack.length - 1];
    const diff = Math.abs(this.current.x - last.x);

    /* miss → game over */
    if (diff >= last.width) {
      this.endGame();
      return;
    }

    /* perfect threshold */
    const perfectThreshold = 10;
    const isPerfect = diff < perfectThreshold;

    let newWidth;
    if (isPerfect) {
      newWidth = last.width;
      this.current.x = last.x;
      this.current.setFillStyle(0xffffff);
      this.time.delayedCall(140, () => {
        if (this.current && this.current.active) {
          this.current.setFillStyle(this.colorForScore(this.score));
        }
      });
    } else {
      newWidth = last.width - diff;
      this.current.x = (this.current.x + last.x) / 2;
    }

    this.current.setSize(newWidth, this.blockH);
    this.stack.push(this.current);

    /* scoring */
    if (isPerfect) {
      this.streak++;
      this.multiplier = Math.min(1 + Math.floor(this.streak / 3), 5);
      this.audio.perfect(this.streak);
      this.showPerfectText();
    } else {
      this.streak = 0;
      this.multiplier = 1;
      this.audio.place();
    }

    this.score += this.multiplier;
    this.scoreText.setText(this.score);
    this.updateMultiplierText();

    /* juice */
    this.burst.explode(isPerfect ? 16 : 8, this.current.x, this.current.y);
    this.cameras.main.shake(isPerfect ? 90 : 40, isPerfect ? 0.005 : 0.002);

    /* difficulty */
    this.speed = Math.min(this.baseSpeed + this.score * 0.08, 14);
    this.dir *= -1;

    /* hide hint */
    if (this.hintText.alpha > 0) {
      this.tweens.add({ targets: this.hintText, alpha: 0, duration: 300 });
    }

    /* camera follow */
    this.updateCamera();

    /* next */
    this.spawnBlock();
  }

  updateCamera() {
    const top = this.stack[this.stack.length - 1];
    const anchorY = 350;
    const targetScroll = Math.min(0, top.y - anchorY);
    this.tweens.add({
      targets: this.cameras.main,
      scrollY: targetScroll,
      duration: 200,
      ease: 'Sine.easeOut'
    });
  }

  showPerfectText() {
    const label = this.streak >= 3 ? 'PERFECT x' + this.streak : 'PERFECT';
    const color = this.streak >= 9 ? '#ff9f1c'
                : this.streak >= 6 ? '#facc15'
                : this.streak >= 3 ? '#a5f3fc'
                : '#ffffff';
    const size  = this.streak >= 6 ? 34 : 28;

    const t = this.add.text(this.current.x, this.current.y - 60, label, {
      fontFamily: 'Arial Black, Arial, sans-serif',
      fontSize: size + 'px',
      color: color,
      stroke: '#000000',
      strokeThickness: 4
    }).setOrigin(0.5).setDepth(200);

    this.tweens.add({
      targets: t,
      y: t.y - 80,
      alpha: 0,
      duration: 800,
      ease: 'Cubic.easeOut',
      onComplete: () => t.destroy()
    });
  }

  updateMultiplierText() {
    if (this.multiplier > 1) {
      this.multiplierText.setText('x' + this.multiplier);
      this.multiplierText.setScale(1.35);
      this.tweens.add({
        targets: this.multiplierText,
        scale: 1,
        duration: 250,
        ease: 'Back.easeOut'
      });
    } else {
      this.multiplierText.setText('');
    }
  }

  /* ---------- end ---------- */
  endGame() {
    if (this.gameOver) return;
    this.gameOver = true;

    this.audio.fail();
    this.cameras.main.shake(400, 0.016);

    const flash = this.add.rectangle(this.cx, this.H / 2, this.W, this.H, 0xff2d55, 0.35)
      .setScrollFactor(0).setDepth(300);
    this.tweens.add({
      targets: flash, alpha: 0, duration: 500,
      onComplete: () => flash.destroy()
    });

    if (this.current) {
      this.tweens.add({
        targets: this.current,
        y: this.current.y + 800,
        angle: (Math.random() > 0.5 ? 1 : -1) * 90,
        alpha: 0,
        duration: 700,
        ease: 'Cubic.easeIn'
      });
    }

    const isNewBest = this.score > this.best;
    if (isNewBest) {
      this.best = this.score;
      localStorage.setItem('aetherSpireBest', String(this.best));
    }

    /* === AD HOOK =========================================
       Insert after GameMonetize SDK is added to <head>:

         if (typeof sdk !== 'undefined' && sdk.showBanner) {
           sdk.showBanner();
         }

       Interstitial on every game over. This is the natural
       break point and keeps the flow clean.
       ===================================================== */

    this.time.delayedCall(700, () => this.showGameOver(isNewBest));
  }

  showGameOver(isNewBest) {
    const panel = this.add.container(0, 0).setDepth(400).setScrollFactor(0).setAlpha(0);

    const bg = this.add.rectangle(this.cx, this.H / 2, this.W, this.H, 0x03050a, 0.88);

    const title = this.add.text(this.cx, 340, 'SPIRE FALLEN', {
      fontFamily: 'Arial Black, Arial, sans-serif',
      fontSize: '52px',
      color: '#ff2d55'
    }).setOrigin(0.5);

    const lbl = this.add.text(this.cx, 460, 'HEIGHT', {
      fontFamily: 'Arial, sans-serif',
      fontSize: '22px',
      color: '#64748b',
      letterSpacing: 6
    }).setOrigin(0.5);

    const val = this.add.text(this.cx, 590, String(this.score), {
      fontFamily: 'Arial Black, Arial, sans-serif',
      fontSize: '180px',
      color: '#ffffff'
    }).setOrigin(0.5);

    const sub = this.add.text(this.cx, 720, 'BEST  ' + this.best, {
      fontFamily: 'Arial, sans-serif',
      fontSize: '26px',
      color: '#94a3b8'
    }).setOrigin(0.5);

    panel.add([bg, title, lbl, val, sub]);

    if (isNewBest) {
      const tag = this.add.text(this.cx, 810, 'NEW BEST!', {
        fontFamily: 'Arial Black, Arial, sans-serif',
        fontSize: '36px',
        color: '#facc15'
      }).setOrigin(0.5);
      panel.add(tag);
      this.tweens.add({
        targets: tag, scale: 1.12, duration: 520,
        yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
      });
    }

    const retry = this.add.text(this.cx, this.H - 200, 'TAP TO RISE AGAIN', {
      fontFamily: 'Arial, sans-serif',
      fontSize: '28px',
      color: '#38bdf8'
    }).setOrigin(0.5);
    panel.add(retry);
    this.tweens.add({
      targets: retry, alpha: 0.35, duration: 850,
      yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
    });

    this.tweens.add({ targets: panel, alpha: 1, duration: 300 });
    val.setScale(0.4);
    this.tweens.add({ targets: val, scale: 1, duration: 500, ease: 'Back.easeOut' });
  }

  /* ---------- loop ---------- */
  update(time, delta) {
    if (this.gameOver || !this.current) return;

    const dt = Math.min(delta, 50) / 16.6667;
    this.current.x += this.speed * this.dir * dt;

    const halfW = this.current.width / 2;
    if (this.current.x < -halfW) {
      this.current.x = -halfW;
      this.dir = 1;
    } else if (this.current.x > this.W + halfW) {
      this.current.x = this.W + halfW;
      this.dir = -1;
    }
  }
}

window.game = new Phaser.Game({
  type: Phaser.AUTO,
  width: 720,
  height: 1280,
  backgroundColor: '#0a0a1a',
  parent: 'game-container',
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },
  render: { antialias: true, roundPixels: false },
  scene: Game
});
</script>
</body>
</html>
